<div class="dashboard-container">

  <h4>{{ role }}</h4>
  <h1>{{ welcomeText }}</h1>
  <p>{{ description }}</p>


  <div class="row">
    <!-- Add button shown when table is visible -->
    <div *ngIf="!showForm" class="col-md-3 offset-md-8 text-end">
      <button class="add-btn btn btn-primary" (click)="openAddForm()">
        <i class="fas fa-user-plus me-2"></i>Add Student
      </button>
    </div>

    <!-- Save / Clear shown when form is visible (same line, right aligned) -->
    <div *ngIf="showForm" class="col-12 d-flex justify-content-end gap-2">
      <button class="btn btn-success" (click)="closeForm()">
        <i class="fas fa-save me-2"></i>Save Form
      </button>
      <button class="btn btn-outline-secondary" (click)="openAddForm()">
        <i class="fas fa-broom me-2"></i>Clear Form
      </button>
    </div>
  </div>
  <!-- Table Section -->

  <div *ngIf="!showForm" class="mat-elevation-z8 table-container">
    <mat-form-field class="filter-field">
      <mat-label>Filter</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Mia" #input>
    </mat-form-field>
    <table mat-table class="fixed-header-table" [dataSource]="dataSource" matSort>

      <!-- ID Column -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
        <td mat-cell *matCellDef="let row"> {{row.id}} </td>
      </ng-container>

      <!-- Progress Column -->
      <ng-container matColumnDef="progress">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Progress </th>
        <td mat-cell *matCellDef="let row"> {{row.progress}}% </td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
        <td mat-cell *matCellDef="let row"> {{row.name}} </td>
      </ng-container>

      <!-- Fruit Column -->
      <ng-container matColumnDef="fruit">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Fruit </th>
        <td mat-cell *matCellDef="let row"> {{row.fruit}} </td>
      </ng-container>
      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> </th>
        <td mat-cell *matCellDef="let row" class="actions-cell">
          <!-- breadcrumb / ellipsis icon (Font Awesome) -->
          <button class="action-trigger" (click)="toggleActions(row.id, $event)" aria-label="row actions">
            <i class="fas fa-ellipsis-v"></i>
          </button>

          <!-- inline popover with edit/delete -->
          <div class="action-popover" *ngIf="activeRow === row.id" (click)="$event.stopPropagation()">
            <button class="icon-btn edit" (click)="onEdit(row)" title="Edit">
              <i class="fas fa-edit"></i>
            </button>
            <button class="icon-btn delete" (click)="onDelete(row)" title="Delete">
              <i class="fas fa-trash-alt"></i>
            </button>
          </div>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>


      <!-- Row shown when there is no matching data. -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
      </tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons aria-label="Select page of periodic elements">
    </mat-paginator>
  </div>

  <!-- Form Section -->
  <div *ngIf="showForm" class="form-section" id="student-form">
    <form action="" method="post">

      <div class="formInfo container row">
        <h3>Parent Information</h3>
        <strong>Father Information</strong>
        <div class="row">
          <div class="fname col-6 col-md-4">
            <label for="fname me-3">First Name</label>
            <input type="text" id="fname" name="firstname" placeholder="Your name..">
          </div>
          <div class="midname col-6 col-md-4">
            <label for="midname">Middle Name</label>
            <input type="text" id="midname" name="middlename" placeholder="Your middle name..">
          </div>
          <div class="lname col-6 col-md-4">
            <label for="lname">Last Name</label>
            <input type="text" id="lname" name="lastname" placeholder="Your last">
          </div>
          <div class="w-100"></div>
          <div class="emailid col-6 col-md-4">
            <label for="emailId">Email ID</label>
            <input type="email" id="emailId" name="emailid" placeholder="Your email id..">
          </div>

          <div class="phoneNo col-6 col-md-4">
            <label for="phoneNo">Phone No</label>
            <input type="tel" id="phoneNo" name="phoneno" placeholder="Your phone no..">
          </div>
        </div>
        <strong>Mother Information</strong>
        <div class="row">
          <div class="fname col-6 col-md-4">
            <label for="fname me-3">First Name</label>
            <input type="text" id="fname" name="firstname" placeholder="Your name..">
          </div>
          <div class="midname col-6 col-md-4">
            <label for="midname">Middle Name</label>
            <input type="text" id="midname" name="middlename" placeholder="Your middle name..">
          </div>
          <div class="lname col-6 col-md-4">
            <label for="lname">Last Name</label>
            <input type="text" id="lname" name="lastname" placeholder="Your last">
          </div>
          <div class="w-100"></div>
          <div class="emailid col-6 col-md-4">
            <label for="emailId">Email ID</label>
            <input type="email" id="emailId" name="emailid" placeholder="Your email id..">
          </div>

          <div class="phoneNo col-6 col-md-4">
            <label for="phoneNo">Phone No</label>
            <input type="tel" id="phoneNo" name="phoneno" placeholder="Your phone no..">
          </div>
        </div>
      </div>

    </form>

  </div>

</div>
