<div class="dashboard-container">

  <h4>{{ role }}</h4>
  <h1>{{ welcomeText }}</h1>
  <p>{{ description }}</p>

  <div class="tile-container">
    <app-card-tile
      *ngFor="let t of tiles"
      [icon]="t.icon"
      [title]="t.title"
      [subtitle]="t.subtitle"
      [link]="t.link">
    </app-card-tile>
  </div>

</div>
